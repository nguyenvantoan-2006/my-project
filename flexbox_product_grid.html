<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lưới thẻ sản phẩm co giãn với Flexbox</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f1f5f9;
      color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .page-heading {
      margin-bottom: 28px;
      text-align: center;
    }

    .page-heading h1 {
      margin: 0 0 10px;
      color: #1e3a8a;
      font-size: 32px;
    }

    .page-heading p {
      margin: 0;
      color: #475569;
      line-height: 1.6;
    }

    .product-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }

    .product-card {
      flex: 1 1 calc(25% - 20px);
      min-width: 220px;
      padding: 20px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
    }

    .product-card h2 {
      margin: 0 0 12px;
      color: #1e293b;
      font-size: 20px;
    }

    .product-card p {
      margin: 0;
    }

    .price {
      color: #2563eb;
      font-size: 18px;
      font-weight: 700;
    }

    .submission-form {
      max-width: 680px;
      margin: 24px auto 0;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .submission-form label {
      display: block;
      margin-bottom: 10px;
      color: #1e293b;
      font-weight: 700;
    }

    .submission-controls {
      display: flex;
      gap: 12px;
    }

    .submission-controls input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }

    .submission-controls input:focus {
      border-color: #2563eb;
      outline: 2px solid #bfdbfe;
    }

    .submission-controls button {
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .submission-controls button:hover {
      background: #1d4ed8;
    }

    .submission-status {
      margin: 14px 0 0;
      color: #166534;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      main {
        padding: 32px 16px;
      }

      .page-heading h1 {
        font-size: 26px;
      }

      .product-grid {
        padding: 12px 0;
      }

      .submission-form {
        padding: 18px;
      }

      .submission-controls {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .product-card {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-heading">
      <h1>Danh sách sản phẩm</h1>
      <p>Các thẻ tự sắp xếp lại theo chiều rộng màn hình nhờ Flexbox.</p>
    </header>

    <section class="product-grid" aria-label="Danh sách sản phẩm">
      <article class="product-card">
        <h2>Sản phẩm 1</h2>
        <p class="price">500.000 đ</p>
      </article>
      <article class="product-card">
        <h2>Sản phẩm 2</h2>
        <p class="price">750.000 đ</p>
      </article>
      <article class="product-card">
        <h2>Sản phẩm 3</h2>
        <p class="price">1.200.000 đ</p>
      </article>
      <article class="product-card">
        <h2>Sản phẩm 4</h2>
        <p class="price">320.000 đ</p>
      </article>
    </section>

    <form class="submission-form" id="submission-form">
      <label for="submission-url">Link bài nộp</label>
      <div class="submission-controls">
        <input
          id="submission-url"
          name="submission-url"
          type="url"
          placeholder="Nhập đường dẫn (URL)..."
          required
        >
        <button type="submit">Nộp bài</button>
      </div>
      <p class="submission-status" id="submission-status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const submissionForm = document.querySelector("#submission-form");
    const submissionUrl = document.querySelector("#submission-url");
    const submissionStatus = document.querySelector("#submission-status");

    submissionForm.addEventListener("submit", (event) => {
      event.preventDefault();
      submissionStatus.textContent = "";

      if (!submissionUrl.validity.valid) {
        submissionUrl.reportValidity();
        return;
      }

      submissionStatus.textContent =
        "Link hợp lệ! Đây là bản demo, link chưa được gửi lên máy chủ.";
    });
  </script>
</body>
</html>
